<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greek Street View - Code Only</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 9 / 16;
    }
  </style>
</head>
<body>

<canvas id="streetCanvas" width="540" height="960"></canvas>

<script>
  // =================================================================
  // 画像ファイルを一切使わず、数学・幾何学描画でギリシャの街並みを構築
  // =================================================================
  const canvas = document.getElementById('streetCanvas');
  const ctx = canvas.getContext('2d');

  // 画面の消失点（奥のパルテノン神殿の足元付近）
  const vp = { x: canvas.width / 2, y: canvas.height * 0.42 };

  function drawGreekCity() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. 空と太陽光（地中海の澄んだ青空）
    const skyGrad = ctx.createLinearGradient(0, 0, 0, vp.y);
    skyGrad.addColorStop(0, '#2d72d9');
    skyGrad.addColorStop(0.6, '#64a7f5');
    skyGrad.addColorStop(1, '#d8ecf8');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvas.width, vp.y);

    // 2. 遠景：アクロポリスの丘
    ctx.fillStyle = '#b3a078';
    ctx.beginPath();
    ctx.moveTo(canvas.width * 0.2, vp.y);
    ctx.quadraticCurveTo(canvas.width * 0.5, vp.y - 70, canvas.width * 0.8, vp.y);
    ctx.fill();

    // 丘の陰影
    ctx.fillStyle = '#9e8963';
    ctx.beginPath();
    ctx.moveTo(canvas.width * 0.45, vp.y - 65);
    ctx.lineTo(canvas.width * 0.8, vp.y);
    ctx.lineTo(canvas.width * 0.5, vp.y);
    ctx.fill();

    // 3. 丘の頂上に建つパルテノン神殿（シルエット）
    drawParthenon(vp.x, vp.y - 65, 70, 22);

    // 4. 中央の石畳の街道（透視投影）
    drawCobblestoneRoad();

    // 5. 街道両脇の街並み（白壁・オレンジ屋根・オーニング）
    drawBuildings();
  }

  // 遠景のパルテノン神殿描画
  function drawParthenon(x, y, width, height) {
    ctx.save();
    ctx.translate(x - width / 2, y);

    // 基壇
    ctx.fillStyle = '#dfd6c3';
    ctx.fillRect(0, height - 4, width, 4);

    // 屋根（三角破風）
    ctx.fillStyle = '#f0ebe1';
    ctx.beginPath();
    ctx.moveTo(0, 5);
    ctx.lineTo(width / 2, 0);
    ctx.lineTo(width, 5);
    ctx.fill();

    // 等間隔の柱
    const cols = 8;
    const colWidth = 2.5;
    ctx.fillStyle = '#f7f4ed';
    for (let i = 0; i < cols; i++) {
      const cx = (width / (cols - 1)) * i - (colWidth / 2);
      ctx.fillRect(cx, 5, colWidth, height - 9);
    }

    ctx.restore();
  }

  // 石畳のメインストリート
  function drawCobblestoneRoad() {
    const roadLeft = 0;
    const roadRight = canvas.width;

    // 道路ベース（明るい砂岩色）
    ctx.fillStyle = '#e8dec8';
    ctx.beginPath();
    ctx.moveTo(vp.x - 30, vp.y);
    ctx.lineTo(vp.x + 30, vp.y);
    ctx.lineTo(roadRight, canvas.height);
    ctx.lineTo(roadLeft, canvas.height);
    ctx.closePath();
    ctx.fill();

    // 石畳の横目地（手前に来るほど間隔が広がる透視分割）
    ctx.strokeStyle = 'rgba(150, 130, 100, 0.4)';
    ctx.lineWidth = 1.5;
    for (let i = 1; i <= 25; i++) {
      const t = Math.pow(i / 25, 2.2); // 非線形パース補間
      const curY = vp.y + (canvas.height - vp.y) * t;
      const lx = vp.x + (roadLeft - vp.x) * t;
      const rx = vp.x + (roadRight - vp.x) * t;

      ctx.beginPath();
      ctx.moveTo(lx, curY);
      ctx.lineTo(rx, curY);
      ctx.stroke();
    }
  }

  // 左右に立ち並ぶ古代ギリシャ風の建築群
  function drawBuildings() {
    // --- 左側の建物群（手前〜奥） ---
    // 左・奥の建物
    drawGreekHouse(0, vp.y - 10, 140, 180, '#f2ece1', '#d46b38', true);
    // 左・手前の露店＆家（オーニング付き）
    drawGreekHouse(-40, vp.y + 120, 260, 480, '#e5dccb', '#be5427', true, true);

    // --- 右側の建物群（手前〜奥） ---
    // 右・奥の建物
    drawGreekHouse(canvas.width - 130, vp.y - 5, 130, 170, '#ece5d8', '#cf622f', false);
    // 右・手前の列柱のある建物
    drawGreekHouse(canvas.width - 220, vp.y + 130, 260, 470, '#f5efe6', '#be5427', false, false, true);
  }

  // ギリシャ建築を描画する汎用関数
  function drawGreekHouse(x, y, w, h, wallColor, roofColor, isLeft, hasAwning = false, hasColumns = false) {
    ctx.save();

    // 1. 白壁（石造り）
    ctx.fillStyle = wallColor;
    ctx.fillRect(x, y, w, h);

    // 壁の陰影（立体感の付与）
    ctx.fillStyle = isLeft ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.15)';
    ctx.fillRect(x, y, w, h);

    // 2. テラコッタ瓦の屋根（オレンジの傾斜屋根）
    ctx.fillStyle = roofColor;
    ctx.beginPath();
    if (isLeft) {
      ctx.moveTo(x - 10, y);
      ctx.lineTo(x + w + 10, y + 20);
      ctx.lineTo(x + w, y + 35);
      ctx.lineTo(x - 10, y + 15);
    } else {
      ctx.moveTo(x - 10, y + 20);
      ctx.lineTo(x + w + 10, y);
      ctx.lineTo(x + w + 10, y + 15);
      ctx.lineTo(x - 10, y + 35);
    }
    ctx.fill();

    // 3. オーニング（青と白のストライプ日よけ幕）
    if (hasAwning) {
      const awY = y + h * 0.45;
      const awH = 45;
      const stripes = 8;
      for (let s = 0; s < stripes; s++) {
        ctx.fillStyle = (s % 2 === 0) ? '#2e66b8' : '#f5f5f5';
        ctx.beginPath();
        const sx = x + (w / stripes) * s;
        const sw = w / stripes;
        ctx.moveTo(sx, awY);
        ctx.lineTo(sx + sw, awY);
        ctx.lineTo(sx + sw + 15, awY + awH);
        ctx.lineTo(sx + 15, awY + awH);
        ctx.fill();
      }
    }

    // 4. 円柱（ドリス式列柱）
    if (hasColumns) {
      const colY = y + h * 0.35;
      const colH = h * 0.65;
      const colCount = 3;
      for (let c = 0; c < colCount; c++) {
        const cx = x + 30 + c * 55;
        // 柱の本体
        const colGrad = ctx.createLinearGradient(cx, 0, cx + 18, 0);
        colGrad.addColorStop(0, '#f9f6ee');
        colGrad.addColorStop(0.5, '#e3ded0');
        colGrad.addColorStop(1, '#b8b2a2');
        ctx.fillStyle = colGrad;
        ctx.fillRect(cx, colY, 18, colH);

        // 柱頭（飾り）
        ctx.fillStyle = '#e8e2d5';
        ctx.fillRect(cx - 4, colY - 8, 26, 8);
      }
    }

    ctx.restore();
  }

  // 描画実行
  drawGreekCity();
</script>
</body>
</html>
