<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Narcissus Walk</title>
  <style>
    /* 画面全体のリセットと背景スタイル */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0b0c10;
      color: #c5c6c7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    /* スマホ画面比率のゲームコンテナ */
    #gameContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 450px;
      max-height: 800px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background-color: #1f2833;
    }
    /* スタート画面（要件：2画面構成の1つ目） */
    #startScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #1f2833 0%, #0b0c10 100%);
      z-index: 10;
      text-align: center;
      padding: 24px;
    }
    h1 {
      font-size: 2.2rem;
      letter-spacing: 0.2em;
      color: #ffd700;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
    }
    .subtitle {
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      color: #45a29e;
      margin-bottom: 2rem;
    }
    .instructions {
      font-size: 0.8rem;
      line-height: 1.8;
      color: #c5c6c7;
      margin-bottom: 2.5rem;
      background: rgba(255, 255, 255, 0.05);
      padding: 16px;
      border-radius: 8px;
    }
    .btn {
      padding: 14px 40px;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 0.15em;
      color: #0b0c10;
      background: #ffd700;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
      transition: transform 0.1s ease;
    }
    .btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

<div id="gameContainer">
  <!-- メイン描画キャンバス -->
  <canvas id="gameCanvas" width="450" height="800"></canvas>

  <!-- スタート画面オーバーレイ -->
  <div id="startScreen">
    <h1>NARCISSUS</h1>
    <div class="subtitle">WALK & REFLECTION</div>
    <div class="instructions">
      【長押し / 画面ホールド】<br>
      手鏡で顔を見て自己愛（HP）を充填<br>
      ※前が見えない間は「音の波紋」で危険を察知<br><br>
      【左右キー / 左右タップ】<br>
      障害物を回避（鏡から目を離すとHP激減）
    </div>
    <button class="btn" id="startBtn">START</button>
  </div>
</div>

<script>
  // ==========================================
  // 1. システム定数・変数定義
  // ==========================================
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const startScreen = document.getElementById('startScreen');
  const startBtn = document.getElementById('startBtn');

  // ゲーム進行ステータス
  let gameState = 'START'; // 'START' | 'PLAYING' | 'GAMEOVER'
  let score = 0;           // 歩行距離（スコア）
  let loveGauge = 100;     // 自己愛ゲージ（HP: 0でゲームオーバー）
  let isPeekingMirror = false; // 手鏡を凝視しているかフラグ
  let mirrorTransition = 0;    // 手鏡の表示割合（0.0: 下げている 〜 1.0: 凝視）

  // プレイヤー位置（3レーンシステム: -1: 左, 0: 中央, 1: 右）
  let playerLane = 0;
  let targetLaneX = 225;
  let currentLaneX = 225;

  // 自動生成される障害物（通行人・三角コーン等）の配列
  let obstacles = [];
  let obstacleTimer = 0;

  // エコーロケーション（音響反響）波紋エフェクト配列
  let echoRipples = [];

  // スクロール速度
  let baseSpeed = 4;
  let currentSpeed = 4;

  // ==========================================
  // 2. 入力イベント設定
  // ==========================================
  // スタートボタン
  startBtn.addEventListener('click', () => {
    startScreen.style.display = 'none';
    resetGame();
    gameState = 'PLAYING';
  });

  // キーボード操作（PC向け）
  window.addEventListener('keydown', (e) => {
    if (gameState !== 'PLAYING') return;
    if (e.code === 'Space') isPeekingMirror = true;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') changeLane(-1);
    if (e.code === 'ArrowRight' || e.code === 'KeyD') changeLane(1);
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space') isPeekingMirror = false;
  });

  // タッチ/マウス操作（スマホ・直感操作向け）
  // 画面長押しで手鏡凝視、左右タップでレーン移動
  let pointerDownTime = 0;
  canvas.addEventListener('pointerdown', (e) => {
    if (gameState === 'GAMEOVER') {
      resetGame();
      gameState = 'PLAYING';
      return;
    }
    if (gameState !== 'PLAYING') return;

    pointerDownTime = Date.now();
    isPeekingMirror = true;

    // 左右どちらをタップしたかでレーン移動
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    if (x < rect.width * 0.35) {
      changeLane(-1);
    } else if (x > rect.width * 0.65) {
      changeLane(1);
    }
  });

  window.addEventListener('pointerup', () => {
    isPeekingMirror = false;
  });

  function changeLane(direction) {
    playerLane = Math.max(-1, Math.min(1, playerLane + direction));
    targetLaneX = 225 + playerLane * 110;
  }

  // ==========================================
  // 3. ゲームリセット・生成ロジック
  // ==========================================
  function resetGame() {
    score = 0;
    loveGauge = 100;
    playerLane = 0;
    currentLaneX = 225;
    targetLaneX = 225;
    obstacles = [];
    echoRipples = [];
    isPeekingMirror = false;
    mirrorTransition = 0;
    currentSpeed = baseSpeed;
  }

  // 障害物の自動プロシージャル生成
  function spawnObstacle() {
    const lanes = [-1, 0, 1];
    const lane = lanes[Math.floor(Math.random() * lanes.length)];
    const type = Math.random() < 0.6 ? 'PEDESTRIAN' : 'CONE'; // 通行人 or コーン

    obstacles.push({
      lane: lane,
      x: 225 + lane * 110,
      y: -60,
      radius: 24,
      type: type,
      soundTimer: 0 // 波紋生成インターバル
    });
  }

  // ==========================================
  // 4. メイン更新処理（コアループ）
  // ==========================================
  function update() {
    if (gameState !== 'PLAYING') return;

    // 1. 手鏡のアニメーション遷移（滑らかな没頭演出）
    if (isPeekingMirror) {
      mirrorTransition = Math.min(1.0, mirrorTransition + 0.12);
      // 鏡凝視中：自己愛回復 & 陶酔による加速（前借り）
      loveGauge = Math.min(100, loveGauge + 0.35);
      currentSpeed = baseSpeed * 1.5;
    } else {
      mirrorTransition = Math.max(0.0, mirrorTransition - 0.15);
      // 前方確認中：自己愛激減 & 通常速度
      loveGauge -= 0.6;
      currentSpeed = baseSpeed;
    }

    // 自己愛枯渇による死
    if (loveGauge <= 0) {
      loveGauge = 0;
      gameState = 'GAMEOVER';
      return;
    }

    // スコア加算
    score += Math.floor(currentSpeed * 0.1);

    // プレイヤーの左右スムーズ移動
    currentLaneX += (targetLaneX - currentLaneX) * 0.25;

    // 2. 障害物の生成管理
    obstacleTimer++;
    const spawnRate = Math.max(35, 70 - Math.floor(score / 50));
    if (obstacleTimer > spawnRate) {
      spawnObstacle();
      obstacleTimer = 0;
    }

    // 3. 障害物の移動とエコー（音響反響）生成
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const obs = obstacles[i];
      obs.y += currentSpeed;

      // エコーロケーション波紋の定期的発生
      obs.soundTimer++;
      if (obs.soundTimer > 25) {
        obs.soundTimer = 0;
        echoRipples.push({
          x: obs.x,
          y: obs.y,
          radius: 10,
          maxRadius: 80,
          alpha: 0.8
        });
      }

      // プレイヤーとの衝突判定（Y=650付近がプレイヤーの立ち位置）
      const playerY = 650;
      const distX = obs.x - currentLaneX;
      const distY = obs.y - playerY;
      const distance = Math.hypot(distX, distY);

      if (distance < obs.radius + 20) {
        // 激突ペナルティ：自己愛大ダメージ
        loveGauge -= 40;
        obstacles.splice(i, 1);
        if (loveGauge <= 0) gameState = 'GAMEOVER';
        continue;
      }

      // 画面外への到達で削除
      if (obs.y > canvas.height + 60) {
        obstacles.splice(i, 1);
      }
    }

    // 4. エコー波紋の拡大・減衰更新
    for (let i = echoRipples.length - 1; i >= 0; i--) {
      const rip = echoRipples[i];
      rip.radius += 2.5;
      rip.alpha -= 0.025;
      if (rip.alpha <= 0 || rip.radius >= rip.maxRadius) {
        echoRipples.splice(i, 1);
      }
    }
  }

  // ==========================================
  // 5. 描画処理（画像不使用・プロシージャル）
  // ==========================================
  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // --- 1. 道路・レーンの描画 ---
    ctx.fillStyle = '#1a1d24';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 白線（歩行速度に合わせてスクロール）
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.lineWidth = 4;
    ctx.setLineDash([30, 30]);
    ctx.lineDashOffset = -score * 4;

    ctx.beginPath();
    ctx.moveTo(170, 0);
    ctx.lineTo(170, canvas.height);
    ctx.moveTo(280, 0);
    ctx.lineTo(280, canvas.height);
    ctx.stroke();
    ctx.setLineDash([]); // リセット

    // --- 2. 障害物とエコーの描画 ---
    // 手鏡を凝視している深さに応じて前方を暗黒＆ボカしマスク
    const roadAlpha = 1.0 - (mirrorTransition * 0.85);

    ctx.save();
    ctx.globalAlpha = roadAlpha;

    obstacles.forEach(obs => {
      if (obs.type === 'PEDESTRIAN') {
        // 通行人（青灰色のシルエット）
        ctx.fillStyle = '#61dafb';
        ctx.beginPath();
        ctx.arc(obs.x, obs.y, 16, 0, Math.PI * 2);
        ctx.fill();
        // 肩
        ctx.fillStyle = '#282c34';
        ctx.beginPath();
        ctx.ellipse(obs.x, obs.y + 12, 22, 10, 0, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // 三角コーン（警告色オレンジ）
        ctx.fillStyle = '#ff6b6b';
        ctx.beginPath();
        ctx.arc(obs.x, obs.y, 14, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    // プレイヤーの体（後頭部）
    ctx.fillStyle = '#ffd700'; // ナルキッソスの輝く金髪
    ctx.beginPath();
    ctx.arc(currentLaneX, 650, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f5f5f5'; // 白いトガ（古代ギリシャ服）
    ctx.beginPath();
    ctx.ellipse(currentLaneX, 672, 24, 12, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // --- 3. 【エコーロケーション演出】音響反響リング ---
    // 手鏡で前が見えなくても、この反響リングだけは鏡の隙間や端に光り輝いて視認できる
    echoRipples.forEach(rip => {
      ctx.strokeStyle = `rgba(100, 255, 218, ${rip.alpha})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(rip.x, rip.y, rip.radius, 0, Math.PI * 2);
      ctx.stroke();
    });

    // --- 4. 【手鏡・自撮り画面演出】（UI & コアビジュアル） ---
    drawMirrorView();

    // --- 5. ステータスUI（文字最小限） ---
    drawStatusUI();

    // --- 6. ゲームオーバーオーバーレイ ---
    if (gameState === 'GAMEOVER') {
      ctx.fillStyle = 'rgba(11, 12, 16, 0.9)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ff5555';
      ctx.font = 'bold 26px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('LOVE WITHERED', canvas.width / 2, canvas.height / 2 - 30);

      ctx.fillStyle = '#ffd700';
      ctx.font = '20px sans-serif';
      ctx.fillText(`DISTANCE: ${score}m`, canvas.width / 2, canvas.height / 2 + 15);

      ctx.fillStyle = '#888';
      ctx.font = '14px sans-serif';
      ctx.fillText('TAP TO RETRY', canvas.width / 2, canvas.height / 2 + 65);
      ctx.textAlign = 'left';
    }
  }

  // 手鏡（およびナルキッソスの美顔）を描画する専用関数
  function drawMirrorView() {
    ctx.save();

    // 鏡の位置とサイズの補間計算
    // 凝視時：画面中央・超巨大 / 非凝視時：画面右下・極小
    const mirrorSize = 70 + mirrorTransition * 180;
    const mirrorX = canvas.width - 60 - mirrorTransition * (canvas.width / 2 - 60);
    const mirrorY = canvas.height - 70 - mirrorTransition * (canvas.height / 2 - 70);

    // 暗転シャドウ（凝視時の周囲視界遮断）
    if (mirrorTransition > 0) {
      ctx.fillStyle = `rgba(5, 5, 10, ${mirrorTransition * 0.75})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // 鏡の枠（黄金の手鏡）
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 6 + mirrorTransition * 6;
    ctx.fillStyle = '#222930';
    ctx.beginPath();
    ctx.arc(mirrorX, mirrorY, mirrorSize, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 鏡の中のナルキッソスの顔（プロシージャル描画）
    ctx.save();
    ctx.beginPath();
    ctx.arc(mirrorX, mirrorY, mirrorSize - 4, 0, Math.PI * 2);
    ctx.clip(); // 鏡の枠内にクリッピング

    const faceScale = 0.4 + mirrorTransition * 1.1;
    ctx.translate(mirrorX, mirrorY + 15 * mirrorTransition);
    ctx.scale(faceScale, faceScale);

    // 肌
    ctx.fillStyle = '#ffe0bd';
    ctx.beginPath();
    ctx.ellipse(0, 0, 45, 60, 0, 0, Math.PI * 2);
    ctx.fill();

    // 金髪
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(0, -35, 50, 0, Math.PI, true);
    ctx.fill();

    // 輝く瞳（手鏡を見ている時は開く）
    ctx.fillStyle = '#45a29e';
    ctx.beginPath();
    ctx.arc(-16, -5, 6, 0, Math.PI * 2);
    ctx.arc(16, -5, 6, 0, Math.PI * 2);
    ctx.fill();

    // 自信に満ちた微笑み
    ctx.strokeStyle = '#d48b70';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 18, 16, 0.2, Math.PI - 0.2);
    ctx.stroke();

    // 凝視中のキラキラエフェクト
    if (mirrorTransition > 0.6) {
      ctx.fillStyle = '#fff';
      const sparkleTime = Date.now() * 0.005;
      for (let s = 0; s < 3; s++) {
        const sx = Math.sin(sparkleTime + s * 2) * 45;
        const sy = Math.cos(sparkleTime + s * 3) * 45;
        ctx.beginPath();
        ctx.arc(sx, sy, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.restore(); // クリップ解除
    ctx.restore();
  }

  // ステータスUI描画
  function drawStatusUI() {
    // 自己愛（HP）ゲージ
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fillRect(20, 20, 180, 14);

    // ゲージ色（ピンチで赤、通常はローズゴールド）
    ctx.fillStyle = loveGauge > 30 ? '#ff7597' : '#ff3333';
    ctx.fillRect(20, 20, (loveGauge / 100) * 180, 14);
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(20, 20, 180, 14);

    // 距離（スコア）表示
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText(`${score} m`, 20, 56);

    // 操作ガイド（開始直後のみ薄く表示）
    if (score < 40 && !isPeekingMirror) {
      ctx.fillStyle = 'rgba(255, 215, 0, 0.8)';
      ctx.font = '13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('HOLD TO LOOK AT MIRROR', canvas.width / 2, canvas.height - 120);
      ctx.textAlign = 'left';
    }
  }

  // ==========================================
  // 6. メインアニメーションループ
  // ==========================================
  function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
  }

  // ループ起動
  requestAnimationFrame(gameLoop);
</script>
</body>
</html>
